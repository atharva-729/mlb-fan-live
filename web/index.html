<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fan Pulse Live</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.2/plotly.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Fan Pulse Live</h1>
      <span id="game-label" class="muted"></span>
    </div>
    <div class="source">
      <label for="source">Readings from</label>
      <select id="source"></select>
      <span id="coverage" class="muted"></span>
    </div>
  </header>

  <div id="error" class="error" hidden></div>

  <main class="layout">
    <section class="left">
      <div class="card video-card">
        <div class="video"><div id="player"></div></div>
        <p id="video-note" class="note"></p>
      </div>

      <div class="card transport">
        <div class="transport-row">
          <button id="play" class="primary" aria-label="Play or pause">Play</button>
          <label class="inline">Speed
            <select id="speed">
              <option value="1">1×</option>
              <option value="4">4×</option>
              <option value="16" selected>16×</option>
              <option value="60">60×</option>
            </select>
          </label>
          <button id="prev-moment">◀ Moment</button>
          <button id="next-moment">Moment ▶</button>
          <span id="clock" class="clock"></span>
        </div>
        <input id="scrub" type="range" min="0" max="1" step="1" value="0" aria-label="Game time">
        <label class="inline check"><input id="show-future" type="checkbox"> Show the whole game on the chart</label>
      </div>

      <div class="card">
        <h2>Moments</h2>
        <div id="moments" class="moments"></div>
      </div>
    </section>

    <section class="right">
      <div class="card scoreboard" id="scoreboard"></div>

      <div class="card">
        <h2>Pulse: win probability and fan mood</h2>
        <div id="legend" class="legend"></div>
        <div id="pulse" class="pulse"></div>
      </div>

      <div class="split">
        <div class="card">
          <h2>Comments</h2>
          <div id="tabs" class="tabs" role="tablist"></div>
          <div id="comments" class="comments"></div>
        </div>
        <div class="card">
          <h2>Who's being talked about <span class="muted">last 2 minutes</span></h2>
          <div id="subjects" class="subjects"></div>
          <div id="player-card" class="player-card"></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
