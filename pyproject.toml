[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fanpulse-live"
version = "0.1.0"
description = "Real-time audience-reaction engine for live sports: Reddit fan reaction synced to MLB play-by-play."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=15",
    "plotly>=5.20",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy (pulls in torch). Only needed for the RoBERTa baseline in Phase 2.
nlp = [
    "transformers>=4.40",
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
fanpulse-live = "fanpulse_live.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
